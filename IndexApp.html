<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>FitPlan · Rutina semanal guiada</title>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --surface2:#1b2130; --line:#252d3b;
    --text:#e6edf3; --muted:#8b95a5;
    --accent:#2dd4a7; --accent-soft:rgba(45,212,167,.13);
    --warm:#f0b429; --warm-soft:rgba(240,180,41,.13);
    --cardio:#f25c8a; --cardio-soft:rgba(242,92,138,.13);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    padding-bottom:40px;
  }
  button{font:inherit;color:inherit}

  .top{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 16px;
    background:rgba(13,17,23,.86);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:36px;height:36px;flex:0 0 36px;border-radius:11px;
    display:grid;place-items:center;font-size:18px;
    background:linear-gradient(135deg,var(--accent),#0ea5e9);
    color:#05130f;
  }
  .brand strong{display:block;font-size:15px;letter-spacing:-.2px}
  .brand small{display:block;font-size:11px;color:var(--muted)}
  .global{flex:0 0 auto;text-align:right}
  .global span{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
  .track{width:110px;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
  .track > div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#38bdf8);transition:width .35s ease}

  .days{
    display:flex; gap:8px; overflow-x:auto; padding:14px 16px 6px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .days::-webkit-scrollbar{display:none}
  .day-btn{
    flex:0 0 auto; padding:9px 16px; border-radius:99px; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-size:13px; font-weight:600; white-space:nowrap;
    transition:.18s ease; position:relative;
  }
  .day-btn:hover{border-color:#38445a;color:var(--text)}
  .day-btn.active{background:var(--accent);border-color:var(--accent);color:#05130f}
  .day-btn .dot{
    position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;
    background:var(--accent);opacity:0;
  }
  .day-btn.active .dot{background:#05130f}
  .day-btn.partial .dot{opacity:1}
  .day-btn.full .dot{opacity:1;background:#38bdf8}
  .day-btn.active.partial .dot,.day-btn.active.full .dot{opacity:1}

  main{padding:10px 16px 0; max-width:1400px; margin:0 auto}

  .day-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:14px; padding:14px 0 18px;
  }
  .day-head h1{margin:0;font-size:clamp(22px,4vw,30px);letter-spacing:-.6px}
  .day-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .day-progress{flex:1 1 180px; min-width:150px; max-width:320px}
  .day-progress .track{width:100%}
  .day-progress small{display:block;font-size:11px;color:var(--muted);margin-top:6px}

  .rest-card{
    margin-top:20px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:38px 24px; text-align:center;
  }
  .rest-card .icon{font-size:44px; line-height:1; margin-bottom:10px}
  .rest-card h2{margin:0 0 8px; font-size:20px; letter-spacing:-.3px}
  .rest-card p{margin:0; color:var(--muted); font-size:14px; max-width:520px; margin-inline:auto}

  .block{margin-bottom:26px}
  .block-head{
    display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;
  }
  .block-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
  .block-head .count{font-size:12px;color:var(--muted);font-weight:500}
  .tag{
    font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
    padding:4px 9px;border-radius:6px;
  }
  .tag.warm{background:var(--warm-soft);color:var(--warm)}
  .tag.main{background:var(--accent-soft);color:var(--accent)}
  .tag.cardio{background:var(--cardio-soft);color:var(--cardio)}

  .grid{display:grid;gap:12px;grid-template-columns:1fr}
  @media (min-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:1200px){ .grid{grid-template-columns:repeat(3,1fr)} }

  .ex{
    position:relative; display:flex; gap:14px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px;
    transition:border-color .2s, transform .2s, opacity .2s;
  }
  .ex:hover{border-color:#374256; transform:translateY(-2px)}
  .ex.done{opacity:.55}
  .ex.done h3{text-decoration:line-through; text-decoration-color:var(--muted)}

  .visual{
    flex:0 0 82px; width:82px; height:82px; border-radius:13px;
    background:var(--surface2); display:grid; place-items:center; overflow:hidden;
  }
  @media (min-width:420px){ .visual{flex-basis:96px;width:96px;height:96px} }
  .visual.warm{color:var(--warm)}
  .visual.main{color:var(--accent)}
  .visual.cardio{color:var(--cardio)}

  .info{min-width:0; flex:1; padding-right:24px}
  .info h3{margin:0 0 6px; font-size:14.5px; font-weight:650; letter-spacing:-.1px}
  .meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; align-items:center}
  .meta span{
    font-size:10.5px; font-weight:700; letter-spacing:.3px;
    padding:3px 8px; border-radius:6px; background:var(--surface2); color:var(--muted);
  }
  .video-btn{
    font-size:10.5px; font-weight:700; letter-spacing:.3px;
    padding:4px 9px; border-radius:6px; cursor:pointer;
    background:rgba(56,189,248,.12); color:#38bdf8;
    border:1px solid rgba(56,189,248,.25);
    display:inline-flex; align-items:center; gap:4px;
    transition:.15s ease;
  }
  .video-btn:hover{background:rgba(56,189,248,.22);border-color:#38bdf8}
  .desc{margin:0; font-size:12.5px; color:var(--muted); line-height:1.5}

  .check{
    position:absolute; top:12px; right:12px;
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:1.5px solid var(--line); background:transparent;
    display:grid; place-items:center; padding:0;
    color:transparent; font-size:13px; line-height:1;
    transition:.18s ease;
  }
  .check:hover{border-color:var(--accent); color:var(--accent)}
  .ex.done .check{background:var(--accent); border-color:var(--accent); color:#05130f}

  .fig{width:100%; height:100%; display:block}
  .fig .body line{stroke:currentColor; stroke-width:7; stroke-linecap:round; fill:none}
  .fig .body circle{fill:currentColor; stroke:none}
  .fig .ground{stroke:#2b3444; stroke-width:3; stroke-dasharray:7 7; stroke-linecap:round}

  .reset{
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    padding:8px 14px; border-radius:10px; font-size:12px; font-weight:600;
    cursor:pointer; transition:.18s;
  }
  .reset:hover{border-color:#f2555a; color:#f2555a}

  /* Modal video */
  .modal{
    position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,.75);
    display:grid; place-items:center; padding:16px;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .modal.open{opacity:1; pointer-events:auto}
  .modal-content{
    width:min(920px,100%); background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; position:relative;
    transform:scale(.96); transition:transform .2s;
  }
  .modal.open .modal-content{transform:scale(1)}
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--line);
  }
  .modal-head strong{font-size:14px}
  .modal-close{
    background:transparent; border:1px solid var(--line);
    width:30px;height:30px;border-radius:9px;cursor:pointer;
    display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1;
    transition:.15s;
  }
  .modal-close:hover{color:#f2555a;border-color:#f2555a}
  .modal-body{padding:0; background:#000; aspect-ratio:16/9; position:relative}
  .modal-body iframe,.modal-body video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .modal-body img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .modal-body .fallback{
    position:absolute; inset:0; display:grid; place-items:center;
    color:var(--muted); font-size:13px; text-align:center; padding:20px;
  }
  .modal-body .fallback a{color:var(--accent); text-decoration:underline}

  footer{
    text-align:center; color:var(--muted); font-size:11.5px;
    padding:26px 16px 10px; border-top:1px solid var(--line); margin-top:10px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">⚡</div>
    <div>
      <strong>FitPlan</strong>
      <small>Rutina semanal guiada</small>
    </div>
  </div>
  <div class="global">
    <span id="gText">0 / 0 completados</span>
    <div class="track"><div id="gBar"></div></div>
  </div>
</header>

<nav class="days" id="days" aria-label="Selector de día"></nav>
<main id="main"></main>
<footer>Marca cada ejercicio al terminarlo · Tu progreso se guarda en este navegador</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-content">
    <div class="modal-head">
      <strong id="modalTitle">Tutorial</strong>
      <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

  }},

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function animTag(animName, part){
  if (REDUCED || !animName) return '';
  const A = ANIMS[animName];
  if (!A) return '';
  const cfg = A.k['.' + part];
  if (!cfg) return '';

  const dur     = cfg.d ?? A.d ?? 1;
  const isRot   = cfg.t !== 'tr';
  const fmt     = v => isRot ? `${v} 0 0` : v;
  const raw     = cfg.v;
  const linear  = cfg.linear ?? A.linear;

  let values, keyTimes, keySplines;

  if (A.alt !== false && raw.length === 2){
    values     = [raw[0], raw[1], raw[0]].map(fmt).join(';');
    keyTimes   = '0;0.5;1';
    const s    = linear ? '0 0 1 1' : '0.42 0 0.58 1';
    keySplines = `${s};${s}`;
  } else {
    values     = raw.map(fmt).join(';');
    keyTimes   = raw.map((_, i) => (i / (raw.length - 1)).toFixed(3)).join(';');
    const s    = linear ? '0 0 1 1' : '0.42 0 0.58 1';
    keySplines = Array(Math.max(raw.length - 1, 1)).fill(s).join(';');
  }

  const begin = cfg.delay ? ` begin="${cfg.delay}s"` : '';

  return `<animateTransform attributeName="transform" type="${isRot ? 'rotate' : 'translate'}" `
       + `values="${values}" keyTimes="${keyTimes}" keySplines="${keySplines}" `
       + `calcMode="spline" dur="${dur}s" repeatCount="indefinite"${begin}/>`;
}

/* =========================================================
   4. ESTADO
   ========================================================= */
const STORE_KEY = 'fitplan.v3';
let done = {};
try { done = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e){ done = {}; }

function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(done)); } catch(e){}
}

const todayIdx = (new Date().getDay() + 6) % 7;
let currentDay = todayIdx;

const BLOCKS = [
  { key:'warm',   label:'Calentamiento',    tag:'Inicio', tagCls:'warm',   cls:'warm' },
  { key:'main',   label:'Rutina principal', tag:'Rutina', tagCls:'main',   cls:'main' },
  { key:'cardio', label:'Cardio final',     tag:'Final',  tagCls:'cardio', cls:'cardio' }
];

function idsOf(day){
  const list = [];
  if (day.rest) return list;
  BLOCKS.forEach(b => {
    (day[b.key] || []).forEach((_, i) => list.push(`${day.key}-${b.key}-${i}`));
  });
  return list;
}
function dayProgress(day){
  const ids = idsOf(day);
  const c = ids.filter(id => done[id]).length;
  return { done:c, total:ids.length };
}
function globalProgress(){
  let d = 0, t = 0;
  PLAN.forEach(day => { const p = dayProgress(day); d += p.done; t += p.total; });
  return { d, t };
}

/* =========================================================
   5. RENDER
   ========================================================= */
const $days = document.getElementById('days');
const $main = document.getElementById('main');
const $gBar = document.getElementById('gBar');
const $gText = document.getElementById('gText');

function renderTabs(){
  $days.innerHTML = PLAN.map((day, i) => {
    const p = dayProgress(day);
    let cls = '';
    if (!day.rest){
      if (p.done > 0 && p.done < p.total) cls = 'partial';
      if (p.done === p.total && p.total > 0) cls = 'full';
    }
    return `<button class="day-btn ${i === currentDay ? 'active' : ''} ${cls}"
              role="tab" aria-selected="${i === currentDay}"
              data-idx="${i}">${day.name}<span class="dot"></span></button>`;
  }).join('');
}

function renderMain(){
  const day = PLAN[currentDay];

  if (day.rest){
    $main.innerHTML = `
      <section class="day-head">
        <div>
          <h1>${day.name}</h1>
          <p>${day.focus}</p>
        </div>
      </section>
      <div class="rest-card">
        <div class="icon">🌙</div>
        <h2>Día de descanso</h2>
        <p>Hoy toca recuperar. Duerme bien, hidrátate y aprovecha para estirar suavemente si lo necesitas. El descanso también es parte del entrenamiento.</p>
      </div>`;
    return;
  }

  const p = dayProgress(day);
  const hasAny = (day.warm?.length || day.main?.length || day.cardio?.length);

  let html = `
    <section class="day-head">
      <div>
        <h1>${day.name}</h1>
        <p>${day.focus}</p>
      </div>
      ${hasAny ? `
      <div class="day-progress">
        <div class="track"><div style="width:${p.total ? (p.done / p.total * 100) : 0}%"></div></div>
        <small>${p.done} de ${p.total} ejercicios completados</small>
      </div>
      <button class="reset" id="resetDay" type="button">Reiniciar día</button>` : ''}
    </section>
  `;

  BLOCKS.forEach(block => {
    const list = day[block.key] || [];
    if (!list.length) return;
    html += `
      <section class="block">
        <div class="block-head">
          <span class="tag ${block.tagCls}">${block.tag}</span>
          <h2>${block.label}</h2>
          <span class="count">${list.length} ejercicio${list.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="grid">
          ${list.map((ex, i) => {
            const id = `${day.key}-${block.key}-${i}`;
            const isDone = !!done[id];
            return `
              <article class="ex ${isDone ? 'done' : ''}" data-id="${id}">
                <div class="visual ${block.cls}">
                  ${FIG[ex.p || 'stand'](ex.a)}
                </div>
                <div class="info">
                  <h3>${ex.n}</h3>
                  <div class="meta">
                    <span>${ex.s}</span>
                    <span>${ex.r}</span>
                    ${ex.v ? `<button class="video-btn" type="button"
                                data-video="${encodeURIComponent(ex.v)}"
                                data-title="${ex.n}"
                                aria-label="Ver tutorial de ${ex.n}">▶ Tutorial</button>` : ''}
                  </div>
                  <p class="desc">${ex.d}</p>
                </div>
                <button class="check" type="button"
                        aria-label="Marcar ${ex.n} como completado"
                        aria-pressed="${isDone}">✓</button>
              </article>`;
          }).join('')}
        </div>
      </section>`;
  });

  $main.innerHTML = html;
}

function renderGlobal(){
  const g = globalProgress();
  $gBar.style.width = (g.t ? (g.d / g.t * 100) : 0) + '%';
  $gText.textContent = `${g.d} / ${g.t} completados`;
}

function renderAll(){
  renderTabs();
  renderMain();
  renderGlobal();
}

/* =========================================================
   6. MODAL DE VIDEO
   ========================================================= */
const $modal      = document.getElementById('modal');
const $modalBody  = document.getElementById('modalBody');
const $modalTitle = document.getElementById('modalTitle');
const $modalClose = document.getElementById('modalClose');

/* Extrae una URL limpia desde:
   - una URL directa
   - un <blockquote cite="..."> de TikTok
   - un <iframe src="..."> de Facebook/Instagram
   - un <a href="..."> dentro de HTML embebido */
function extractUrl(input){
  if (!input) return '';
  const str = String(input).trim();
  if (!str) return '';

  // HTML embebido (TikTok blockquote, iframe, etc.)
  if (/<[a-z][\s\S]*>/i.test(str)){
    // 1) cite="..." (TikTok / blockquotes)
    const cite = str.match(/cite=["']([^"']+)["']/i);
    if (cite) return cite[1].trim();
    // 2) iframe src="..."
    const iframe = str.match(/<iframe[^>]+src=["']([^"']+)["']/i);
    if (iframe) return iframe[1].trim();
    // 3) cualquier href="..."
    const href = str.match(/href=["']([^"']+)["']/i);
    if (href) return href[1].trim();
    // 4) primer https://... dentro del HTML
    const anyUrl = str.match(/https?:\/\/[^\s"'<>]+/i);
    if (anyUrl) return anyUrl[0];
  }

  return str;
}

function classifyVideo(raw){
  const url = extractUrl(raw);
  if (!url) return { type:'none' };

  // YouTube (watch, shorts, embed, youtu.be)
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (yt) return { type:'iframe', src:`https://www.youtube.com/embed/${yt[1]}` };

  // Vimeo
  const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return { type:'iframe', src:`https://player.vimeo.com/video/${vm[1]}` };

  // TikTok (embed v2)
  const tt = url.match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/);
  if (tt) return { type:'iframe', src:`https://www.tiktok.com/embed/v2/${tt[1]}` };

  // Facebook (video o post)
  if (/(facebook\.com|fb\.watch)/i.test(url)){
    return { type:'iframe',
      src:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&width=734` };
  }

  // Instagram (post, reel, tv)
  const ig = url.match(/instagram\.com\/(?:p|reel|tv)\/([A-Za-z0-9_-]+)/);
  if (ig) return { type:'iframe', src:`https://www.instagram.com/p/${ig[1]}/embed` };

  // Video directo
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return { type:'video', src:url };

  // GIF
  if (/\.gif(\?|$)/i.test(url)) return { type:'img', src:url };

  // Fallback: abrir en pestaña nueva
  return { type:'link', src:url };
}

function openModal(rawUrl, title){
  const url = decodeURIComponent(rawUrl || '');
  const info = classifyVideo(url);
  $modalTitle.textContent = title || 'Tutorial';
  let inner = '';

  if (info.type === 'iframe'){
    inner = `<iframe src="${info.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
  } else if (info.type === 'img'){
    inner = `<img src="${info.src}" alt="${title || 'Tutorial'}">`;
  } else if (info.type === 'video'){
    inner = `<video src="${info.src}" controls autoplay playsinline></video>`;
  } else {
    inner = `<div class="fallback">
      Este enlace se abrirá en una pestaña nueva.<br><br>
      <a href="${info.src}" target="_blank" rel="noopener">Abrir tutorial ↗</a>
    </div>`;
    setTimeout(() => window.open(info.src, '_blank', 'noopener'), 200);
  }

  $modalBody.innerHTML = inner;
  $modal.classList.add('open');
  $modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  $modal.classList.remove('open');
  $modal.setAttribute('aria-hidden', 'true');
  $modalBody.innerHTML = '';
  document.body.style.overflow = '';
}

$modalClose.addEventListener('click', closeModal);
$modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $modal.classList.contains('open')) closeModal();
});

/* =========================================================
   7. EVENTOS
   ========================================================= */
$days.addEventListener('click', e => {
  const btn = e.target.closest('.day-btn');
  if (!btn) return;
  currentDay = Number(btn.dataset.idx);
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$main.addEventListener('click', e => {
  const videoBtn = e.target.closest('.video-btn');
  if (videoBtn){
    openModal(videoBtn.dataset.video, videoBtn.dataset.title);
    return;
  }
  const check = e.target.closest('.check');
  if (check){
    const card = check.closest('.ex');
    const id = card.dataset.id;
    done[id] = !done[id];
    if (!done[id]) delete done[id];
    save();
    renderAll();
    return;
  }
  if (e.target.closest('#resetDay')){
    const day = PLAN[currentDay];
    idsOf(day).forEach(id => delete done[id]);
    save();
    renderAll();
  }
});

/* =========================================================
   8. INIT
   ========================================================= */
renderAll();
</script>
